name: Build iOS app

# Compiles the app and spits out an unsigned .ipa.
#
# Unsigned is deliberate: signing is the part that depends on whose phone it is
# going on, so the artifact here is the payload that AltStore, SideStore,
# Sideloadly, Feather or a paid certificate can all sign afterwards.

on:
  push:
    branches:
      - main
      - claude/ios-voice-dictation-replica-xl16wg
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pinning an Xcode older than the image's simulator runtimes makes actool
      # fail with "No simulator runtime version ... available to use with
      # iphonesimulator SDK", so take the newest Xcode the runner has.
      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -switch "$newest"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Regenerate the project
        working-directory: ios
        run: python3 Tools/generate_xcodeproj.py

      # Everything is built for the device. A simulator pass would type-check
      # the same code, but it drags in the simulator runtimes, and those are
      # what broke the first green build on a hosted runner.
      - name: Archive (device, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceAppV4.xcodeproj \
            -scheme VoiceAppV4 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VoiceAppV4.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      # An .ipa is just a zip with the .app inside a Payload/ directory. Doing
      # it by hand avoids -exportArchive, which insists on a signing identity.
      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R "build/VoiceAppV4.xcarchive/Products/Applications/Voice App V4.app" build/Payload/
          cd build
          zip -qry VoiceAppV4-unsigned.ipa Payload
          rm -rf Payload
          ls -lh VoiceAppV4-unsigned.ipa
          echo "--- bundle contents ---"
          unzip -l VoiceAppV4-unsigned.ipa | grep -E "Info.plist|appex|Voice App V4$" | head -20

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAppV4-unsigned-ipa
          path: ios/build/VoiceAppV4-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      # An Actions artifact is a zip behind a login, which a phone browser
      # cannot usefully open. A release asset is a plain file on a stable URL
      # that anyone can tap, so that is what the install instructions point at.
      - name: Publish the downloadable release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Names that say which phone they are for, because the two files sit
          # side by side on a release page and an .ipa and an .apk look alike
          # on a small screen.
          mkdir -p dist
          cp ios/build/VoiceAppV4-unsigned.ipa dist/VoiceAppV4-iPhone-unsigned.ipa
          cp android/VoiceAppV4-4.1.3.apk      dist/VoiceAppV4-Android.apk

          notes=$(cat <<'EOF'
          Rebuilt on every push. Two files, one per phone.

          **Android — `VoiceAppV4-Android.apk`**
          Download it and open it. That is the whole process.

          **iPhone — `VoiceAppV4-iPhone-unsigned.ipa`**
          This one cannot be installed by opening it. iOS refuses to install an
          .ipa from Files, Safari, WhatsApp or AirDrop, so it has to go through a
          signing tool — SideStore, AltStore, Sideloadly or Feather. See
          `docs/SIDELOADING.md`.

          To put dictation on an iPhone without any of that, send the web app
          instead: https://hammaadban111-art.github.io/ai-voice/ — open in Safari,
          Share, Add to Home Screen.
          EOF
          )

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Voice App V4 — latest build" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          else
            gh release create latest \
              --title "Voice App V4 — latest build" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi

          gh release upload latest \
            dist/VoiceAppV4-iPhone-unsigned.ipa \
            dist/VoiceAppV4-Android.apk \
            --clobber

          # Anything else on the release is from a build that no longer exists —
          # two files that look installable but are not is exactly how the wrong
          # one gets sent to someone.
          gh release view latest --json assets --jq '.assets[].name' | while read -r asset; do
            case "$asset" in
              VoiceAppV4-iPhone-unsigned.ipa|VoiceAppV4-Android.apk) ;;
              *) echo "removing stale asset: $asset"; gh release delete-asset latest "$asset" --yes ;;
            esac
          done

          base="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          echo "Android: $base/VoiceAppV4-Android.apk"
          echo "iPhone:  $base/VoiceAppV4-iPhone-unsigned.ipa"
