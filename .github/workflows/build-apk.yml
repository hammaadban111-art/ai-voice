name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Dictate-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dictate-apk
          path: dist/Dictate-latest.apk
          if-no-files-found: error

      # Rolling "latest" release so the newest debug-signed build always
      # lives at a stable download URL for sideloading from the Releases tab,
      # no matter which branch is currently the one being pushed to.
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dictate (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Dictate-latest.apk
          body: |
            Automatically built from the latest commit on the default branch.

            **Install:** download `Dictate-latest.apk` below on your phone and open it
            (you'll need to allow installs from this source). This is a debug-signed
            build meant for personal sideloading — bring your own Gemini API key in
            the app's Settings screen, nothing is bundled and no account is required.
