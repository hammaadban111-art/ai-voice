# XcodeGen spec.
#
# The checked-in VoiceAppV4.xcodeproj is generated from this file. If the
# project ever goes stale or you want to change the bundle id / team, edit here
# and run:
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# (Or run ios/Tools/generate_xcodeproj.py, which writes the same project without
# needing XcodeGen installed.)

name: VoiceAppV4
options:
  bundleIdPrefix: com.hammaad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "4.1.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  VoiceAppV4:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hammaad.voiceappv4
        PRODUCT_NAME: Voice App V4
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/VoiceAppV4.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: VoiceKeyboard
        embed: true
        codeSign: true

  VoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hammaad.voiceappv4.keyboard
        PRODUCT_NAME: VoiceKeyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/VoiceKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
